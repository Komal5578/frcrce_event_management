[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for College Event Management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pwdlib[argon2]>=0.2.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["SIM117", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "concurrency: marks tests as multi-connection concurrency tests",
]
